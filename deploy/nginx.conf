# Load balancer in front of N api replicas (`docker compose up --scale api=3`).
# Any replica can serve any request because chat history lives in Redis, so no
# sticky sessions are needed.

# Request ID: keep the client's X-Request-ID, or create one. The same ID is passed to the
# app (which validates it and logs it on every JSON line) and written to this access log.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format with_request_id '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                           '$request_time upstream=$upstream_addr request_id=$req_id';

server {
    listen 80;
    access_log /var/log/nginx/access.log with_request_id;

    # Docker's embedded DNS. Re-resolving "api" every 10s picks up replicas that are
    # scaled up/down after nginx started; nginx round-robins over all returned IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    client_max_body_size 64k;

    location / {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        # nginx is the edge: REPLACE any client-sent X-Forwarded-For with the real peer address.
        # (Appending would let a client prepend a fake IP and dodge per-IP rate limits.)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Which replica answered - handy to watch requests spread across instances.
        add_header X-Upstream $upstream_addr always;
    }

    # Server-Sent Events: pass every token through immediately.
    location /api/chat/stream {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        # nginx is the edge: REPLACE any client-sent X-Forwarded-For with the real peer address.
        # (Appending would let a client prepend a fake IP and dodge per-IP rate limits.)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;   # long answers from a slow local LLM
        add_header X-Upstream $upstream_addr always;
    }
}
